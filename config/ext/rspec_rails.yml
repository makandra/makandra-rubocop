plugins:
  - rubocop-rspec_rails

inherit_mode:
  merge:
    - Exclude

RSpecRails:
  Enabled: true
  DocumentationBaseURL: https://docs.rubocop.org/rubocop-rspec_rails
  Include:
    - "**/*_spec.rb"
    - "**/spec/**/*"

RSpecRails/AvoidSetupHook:
  Description: Checks that tests use RSpec `before` instead of Rails `setup`.
  Enabled: true
  VersionAdded: '2.4'
  Reference: https://www.rubydoc.info/gems/rubocop-rspec_rails/RuboCop/Cop/RSpecRails/AvoidSetupHook

RSpecRails/FileFixture:
  Description: Prefer `file_fixture` over hardcoded paths into `spec/fixtures`.
  Enabled: pending
  Safe: false
  VersionAdded: '2.33'
  Reference: https://www.rubydoc.info/gems/rubocop-rspec_rails/RuboCop/Cop/RSpecRails/FileFixture

RSpecRails/HaveHttpStatus:
  Description: Checks that tests use `have_http_status` instead of equality matchers.
  Enabled: true
  ResponseMethods:
    - response
    - last_response
  SafeAutoCorrect: false
  VersionAdded: '2.12'
  VersionChanged: '2.27'
  Reference: https://www.rubydoc.info/gems/rubocop-rspec_rails/RuboCop/Cop/RSpecRails/HaveHttpStatus

RSpecRails/HttpStatus:
  Description: Enforces use of symbolic or numeric value to describe HTTP status.
  Enabled: true
  EnforcedStyle: symbolic
  SupportedStyles:
    - numeric
    - symbolic
    - be_status
  VersionAdded: '1.23'
  VersionChanged: '2.20'
  Reference: https://www.rubydoc.info/gems/rubocop-rspec_rails/RuboCop/Cop/RSpecRails/HttpStatus

RSpecRails/HttpStatusNameConsistency:
  Description: Enforces consistency by using the current HTTP status names.
  Enabled: true
  VersionAdded: '2.32'
  Reference: https://www.rubydoc.info/gems/rubocop-rspec_rails/RuboCop/Cop/RSpecRails/HttpStatusNameConsistency

RSpecRails/InferredSpecType:
  Description: Identifies redundant spec type.
  Enabled: true
  Safe: false
  VersionAdded: '2.14'
  Reference: https://www.rubydoc.info/gems/rubocop-rspec_rails/RuboCop/Cop/RSpecRails/InferredSpecType
  Inferences:
    channels: channel
    controllers: controller
    features: feature
    generator: generator
    helpers: helper
    jobs: job
    mailboxes: mailbox
    mailers: mailer
    models: model
    requests: request
    integration: request
    api: request
    routing: routing
    system: system
    views: view

RSpecRails/MinitestAssertions:
  Description: Detects Minitest-like matchers.
  Enabled: true
  VersionAdded: '2.17'
  Reference: https://www.rubydoc.info/gems/rubocop-rspec_rails/RuboCop/Cop/RSpecRails/MinitestAssertions

RSpecRails/NegationBeValid:
  Description: Enforces use of `be_invalid` or `not_to` for negated be_valid.
  AutoCorrect: contextual
  Safe: false
  EnforcedStyle: be_invalid
  SupportedStyles:
    - not_to
    - be_invalid
  Enabled: true
  VersionAdded: '2.23'
  VersionChanged: '2.29'
  Reference: https://www.rubydoc.info/gems/rubocop-rspec_rails/RuboCop/Cop/RSpecRails/NegationBeValid

RSpecRails/ReceivePerformLater:
  Description: Prefer `have_enqueued_job` over `receive(:perform_later)`.
  Enabled: pending
  VersionAdded: '2.33'
  Reference: https://www.rubydoc.info/gems/rubocop-rspec_rails/RuboCop/Cop/RSpecRails/ReceivePerformLater

RSpecRails/TravelAround:
  Description: Checks for time travel helpers in `around` hooks.
  Enabled: false
  Safe: false
  VersionAdded: '2.19'
  Reference: https://www.rubydoc.info/gems/rubocop-rspec_rails/RuboCop/Cop/RSpecRails/TravelAround
